server {
    listen 80;

    # Serve static frontend files
    location / {
        root /app/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Java backend (NOT exposed to the outside)
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
    }

    # Config SSE streaming so NGINX does not interfere with it
    location ~ ^/api/room/.*/stream$ {
        proxy_pass http://localhost:8080;

        # Disable buffering - CRITICAL for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Set required headers for long-running connections
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Increase timeouts so NGINX doesn't kill the "idle" stream
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}